name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Scaffold RN project and extract android/
        run: |
          npx --yes @react-native-community/cli@15 init TempScaffold --version 0.76.9 --skip-install
          rm -rf android
          mv TempScaffold/android android
          cp TempScaffold/metro.config.js metro.config.js
          cp TempScaffold/babel.config.js babel.config.js
          cp TempScaffold/.watchmanconfig .watchmanconfig 2>/dev/null || true
          find android -type f \( -name "*.java" -o -name "*.kt" -o -name "*.gradle" -o -name "*.xml" -o -name "*.properties" \) -exec sed -i 's/com\.tempscaffold/com.pocketledger/g' {} +
          mkdir -p android/app/src/main/java/com/pocketledger
          if [ -d "android/app/src/main/java/com/tempscaffold" ]; then
            cp -r android/app/src/main/java/com/tempscaffold/* android/app/src/main/java/com/pocketledger/
            rm -rf android/app/src/main/java/com/tempscaffold
          fi
          rm -rf TempScaffold

      - run: npm install

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Build Release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease
        working-directory: android
        env:
          MYAPP_RELEASE_STORE_FILE: release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename files
        run: |
          mkdir -p release
          find artifacts/android-builds -name "*.apk" -exec cp {} release/PocketLedger.apk \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PocketLedger RN ${{ github.ref_name }}"
          body: |
            ## PocketLedger React Native ${{ github.ref_name }}

            Offline-first personal finance tracker built with React Native.
            Ghana Cedi (GHS) as default currency. Android build.

            ### Downloads
            - **Android APK** — `PocketLedger.apk` — Install directly on Android

            ### Features
            - Dashboard with real-time balance, income/expenses
            - Transaction list with period/type filters and search
            - Add expenses, income, transfers with categories and accounts
            - Budget tracking with category progress bars
            - Reports with charts
            - Quick Expense for rapid entry
            - Dark mode support
            - Offline-first — all data on device via AsyncStorage

            ### Tech Stack
            React Native 0.76 | Redux Toolkit | React Navigation v7 | TypeScript
          files: |
            release/PocketLedger.apk
