name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - run: npm install

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Generate debug keystore
        run: keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate autolinking config
        run: |
          mkdir -p android/build/generated/autolinking
          npx react-native config > android/build/generated/autolinking/autolinking.json

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Build Release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd android
          gradle assembleRelease --no-daemon
        env:
          MYAPP_RELEASE_STORE_FILE: release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename files
        run: |
          mkdir -p release
          find artifacts/android-builds -name "*.apk" -exec cp {} release/PocketLedger.apk \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PocketLedger RN ${{ github.ref_name }}"
          body: |
            ## PocketLedger React Native ${{ github.ref_name }}

            Offline-first personal finance tracker built with React Native.
            Ghana Cedi (GHS) as default currency. Android build.

            ### Downloads
            - **Android APK** — `PocketLedger.apk` — Install directly on Android

            ### Features
            - Dashboard with real-time balance, income/expenses
            - Transaction list with period/type filters and search
            - Add expenses, income, transfers with categories and accounts
            - Budget tracking with category progress bars
            - Reports with charts (category, monthly trend, balance)
            - Quick Expense for rapid entry
            - Dark mode support
            - Offline-first — all data on device via MMKV

            ### Tech Stack
            React Native 0.76 | Redux Toolkit | NativeWind | React Navigation v7 | TypeScript
          files: |
            release/PocketLedger.apk
